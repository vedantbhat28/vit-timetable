name: Import timetables

on:
  push:
    branches: [main]
    paths: ['pdfs/**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Extract and show the diff, write nothing
        type: boolean
        default: false
      force:
        description: Re-import PDFs even if unchanged
        type: boolean
        default: false
      allow_new:
        description: Allow divisions that are not in tt_divisions yet
        type: boolean
        default: false
      limit:
        description: Read at most this many PDFs this run (blank = all). Useful on the free Gemini tier
        type: string
        default: ''
      accept_large_diff:
        description: Accept a division changing by more than 50%
        type: boolean
        default: false

concurrency:
  group: import-timetables
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Import
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
          ALLOW_NEW: ${{ inputs.allow_new }}
          LARGE: ${{ inputs.accept_large_diff }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ "$ALLOW_NEW" = "true" ]; then args+=(--allow-new); fi
          if [ "$LARGE" = "true" ]; then args+=(--accept-large-diff); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          python scripts/import_timetables.py "${args[@]}"
